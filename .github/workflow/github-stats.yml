name: Update GitHub Stats

on:
  schedule:
    # 每天 UTC 03:00 执行
    - cron: "0 3 * * *"

  # 支持手动执行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 拉取自己的 profile 仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 生成 GitHub Stats SVG
      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&icon_color=CE1D2D&text_color=718096&bg_color=ffffff&hide_title=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 提交生成的 SVG
      - name: Commit Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg

          git diff --cached --quiet || git commit -m "chore: update github stats"

          git push